*{box-sizing:border-box}body{margin:0;background:#202b29;color:#efe4ca;font:16px/1.5 system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:repeating-linear-gradient(13deg,transparent 0 8px,#000 9px,transparent 10px)}main{position:relative;max-width:1080px;margin:auto;padding:28px 30px 80px}h1,h2,h3{font-family:Georgia,serif;line-height:1.1;font-weight:normal}h1{font-size:clamp(2.5rem,8vw,5rem);margin:.15em 0}h2{font-size:2rem;margin:.3em 0}h3{font-size:1.35rem}p{max-width:65ch}a{color:#b8e4d7}button,select,textarea{font:inherit}button{color:#25312d;background:#e4d2ac;border:1px solid #8f7956;padding:.55rem .85rem;cursor:pointer;box-shadow:2px 3px 0 #101b19}button:hover:not(:disabled){background:#fff1d1}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #75c8b8;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:1rem 0}.paper{color:#29342f;background:#e5d5b5;padding:1.3rem 1.5rem;margin:1.4rem 0;box-shadow:4px 5px 0 #111c1a;max-width:800px}.paper a{color:#285d56}.paper .eyebrow{color:#426a5f}.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:#98d2c5}.credit{font-size:.85rem;border-top:1px solid #6d8278;margin-top:2rem;padding-top:1rem;max-width:75ch}.map{display:flex;flex-direction:column;gap:1.1rem;max-width:760px}.floor{border-left:2px dashed #82a99a;padding-left:1rem}.floor>span{display:block;font-size:.75rem;color:#a6c0b0;text-transform:uppercase;letter-spacing:.1em}.floor .bar{margin:.3rem 0}.node{text-align:left;min-width:200px;max-width:100%}.node small{display:block;text-transform:uppercase;letter-spacing:.08em}.row{border-top:1px solid #a99879;padding:.7rem 0}.routine{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:.4rem 0}.routine span{flex:1;min-width:180px}canvas{display:block;width:100%;max-width:900px;background:#17231f;b .sheet{position:relative;aspect-ratio:1/2;min-height:1100px;width:100%;max-width:620px;margin:16px auto;background:#34463f center/cover;border:6px solid #e9dcc0;box-shadow:0 8px 24px #0008}.sheet svg{position:absolute;inset:0;width:100%;height:100%}.sheet line{stroke:#1c1712;stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}.sheet line.open{stroke:#fff3a8;opacity:1;stroke-width:4;filter:drop-shadow(0 0 2px #000)}.sheet line.walked{stroke:#a83c1b;opacity:1;stroke-dasharray:none;stroke-width:4}.pin{position:absolute;transform:translate(-50%,-50%);box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;min-width:44px;min-height:44px;color:#241c12;cursor:pointer}.pin b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#efe4ca;border:3px solid #241c12;font-size:20px;box-shadow:0 2px 5px #000a}.pin small{max-width:96px;padding:0 5px;background:#efe4cae0;font-size:11px;line-height:1.25;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.pin:disabled{cursor:default;opacity:1}.pin:disabled:not(.done) b{filter:saturate(.5) brightness(.8)}.pin:disabled:not(.done) small{display:none}.pin:not(:disabled) b{outline:4px solid #fff3a8;outline-offset:2px;animation:pinpulse 1.4s infinite}.pin:focus-visible b{outline-color:#fff}.pin.elite b{background:#e0a24a}.pin.fight b{background:#d98f70}.pin.rest b{background:#9cc58f}.pin.shop b{background:#e5d27a}.pin.treasure b{background:#f0c95a}.pin.event b,.pin.mystery b{background:#a6b8d8}.pin.done b{background:#857c69;color:#efe4ca}.pin.boss b{width:76px;height:76px;font-size:38px;background:#7a2f2a;color:#efe4ca}.story h2{margin-top:0}.event-art{display:block;width:100%;max-height:360px;object-fit:cover;margin-bottom:12px;border:4px solid #241c12}@keyframes pinpulse{50%{outline-offset:6px}}@media(prefers-reduced-motion:reduce){.pin:not(:disabled) b{
